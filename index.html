    .loading-screen {

    .loading-content {

    .netflix-logo {

        text-shadow: 0 0 5px #E50914, 0 0 10px #E50914, 0 0 15px #E50914;
      }

      50% {
        text-shadow: 0 0 5px #E50914, 0 0 15px #E50914, 0 0 20px #E50914, 0 0 25px #E50914;
      }

      100% {
        text-shadow: 0 0 5px #E50914, 0 0 10px #E50914, 0 0 15px #E50914;
      }

    /* Loading Bar Container */
    .loading-bar-container {

      height: 3px;

      border-radius: 3px;
      margin-top: 24px;

    .loading-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #E50914, #ff4d4d, #E50914);
      background-size: 200% 100%;
      border-radius: 3px;
      transform-origin: left;
      transform: scaleX(0);
      will-change: transform;
      animation: loading-scale 2s cubic-bezier(0.4, 0, 0.2, 1) forwards, shimmer 1s linear infinite;

      }

      100% {
        transform: scaleX(1);
      }
    }

    @keyframes shimmer {

  <script>
    // ─── Popunder-window detection ────────────────────────────────────────────
    // Adsterra's "tab-under" popunder technique works by calling window.open()
    // with the current site URL so the original page stays as the foreground
    // window and the ad opens behind it. That new window has the same-origin
    // URL as its document.referrer, which never happens on a normal first visit.
    //
    // When we detect this, we skip the 2-second splash entirely so the site
    // feels instant and doesn't look like it "reloaded".
    var _isPopunderWindow = (function () {
      try {
        return !!document.referrer &&
          new URL(document.referrer).hostname === location.hostname;
      } catch (e) { return false; }
    })();

    // Splash screen logic - hides as soon as React signals it is ready. No
    // forced minimum delay: the splash only exists to cover the initial paint,
    // and app-ready fires right after React mounts.
    const splashStartTime = Date.now();
    const MIN_SPLASH_TIME = 0;

    function hideSplashScreen() {
      const loadingScreen = document.querySelector('.loading-screen');
      if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
        // Skip fade animation for popunder windows — instant removal looks better
        // than a 0.8s fade on a page that feels like it should already be loaded
        if (_isPopunderWindow) {
          loadingScreen.style.transition = 'none';
        }
        loadingScreen.classList.add('hidden');

        // Remove element after transition ends
        const handleTransitionEnd = () => {
          loadingScreen.remove();
        };

        loadingScreen.addEventListener('transitionend', handleTransitionEnd, { once: true });

        // Safety fallback in case transitionend event doesn't fire
        setTimeout(() => {
          if (document.body.contains(loadingScreen)) {
            loadingScreen.remove();
          }
        }, _isPopunderWindow ? 50 : 1000); // instant removal for popunder windows
      }
    }

    function tryHideSplash() {
      const elapsed = Date.now() - splashStartTime;
      if (elapsed >= MIN_SPLASH_TIME) {
        hideSplashScreen();
      } else {
        setTimeout(hideSplashScreen, MIN_SPLASH_TIME - elapsed);
      }
    }

    // For popunder windows, hide the splash as soon as possible without waiting
    // for the 'app-ready' event — React will still render normally underneath
    if (_isPopunderWindow) {
      hideSplashScreen();
    }

    // Listen for React app ready event
    window.addEventListener('app-ready', tryHideSplash);

    // Fallback: hide after 6 seconds if React never signals (safety net)
    setTimeout(hideSplashScreen, 6000);
  </script>
