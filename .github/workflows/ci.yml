name: CI

# Run on every push to main and on every pull request (any target branch).
"on":
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch,
# so superseded checks don't keep burning runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Realtime Database rules tests
        run: npm run test:rules:transitional && npm run test:rules

      - name: Build production bundle
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking: the pre-existing lint debt (114 errors across 41 files) has
    # been paid down to 0 errors. Warnings (exhaustive-deps etc.) don't fail
    # the job. New lint errors now block merges.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
